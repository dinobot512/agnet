<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Bronze Age Trade Playback</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.9.0/d3.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/topojson/3.0.2/topojson.min.js"></script>
<style>
:root {
  color-scheme: light;
  --surface-1: #fbfaf7;
  --surface-2: #f2f0ea;
  --sea: #eef3f6;
  --land: #e2ddd0;
  --land-edge: #cfc8b6;
  --lane: #b9c4cc;
  --text-primary: #1d1d1b;
  --text-secondary: #55544e;
  --text-muted: #8a897f;
  --border: #dedbd2;
  --accent: #2a78d6;
  --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a; --s4: #eda100;
  --s5: #e87ba4; --s6: #008300; --s7: #4a3aa7; --s8: #e34948;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --surface-1: #1a1a19; --surface-2: #232321; --sea: #18232b; --land: #2c2b27; --land-edge: #3c3a34;
    --lane: #3a4a55; --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e85;
    --border: #3a3935; --accent: #3987e5;
    --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
    --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --surface-1: #1a1a19; --surface-2: #232321; --sea: #18232b; --land: #2c2b27; --land-edge: #3c3a34;
  --lane: #3a4a55; --text-primary: #ffffff; --text-secondary: #c3c2b7; --text-muted: #8f8e85;
  --border: #3a3935; --accent: #3987e5;
  --s1: #3987e5; --s2: #d95926; --s3: #199e70; --s4: #c98500;
  --s5: #d55181; --s6: #008300; --s7: #9085e9; --s8: #e66767;
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100%; }
body {
  background: var(--surface-1); color: var(--text-primary);
  font: 14px/1.4 ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  display: grid; grid-template-columns: 300px minmax(0, 1fr) 340px; grid-template-rows: 100vh;
}
main { display: flex; flex-direction: column; min-width: 0; }
#mapwrap { flex: 1; min-height: 0; position: relative; background: var(--sea); }
svg#map { width: 100%; height: 100%; display: block; }
.land { fill: var(--land); stroke: var(--land-edge); stroke-width: 0.6; }
.lane { stroke: var(--lane); stroke-width: 1; stroke-dasharray: 3 4; fill: none; }
.route { stroke: var(--accent); stroke-width: 2; fill: none; stroke-dasharray: 6 4; opacity: 0.9; }
.port-dot { fill: var(--surface-1); stroke: var(--text-secondary); stroke-width: 1.5; cursor: pointer; }
.port-label { fill: var(--text-primary); font-size: 12px; font-weight: 600; paint-order: stroke;
  stroke: var(--sea); stroke-width: 3px; pointer-events: none; }
.ship { cursor: pointer; }
.ship circle { stroke: var(--surface-1); stroke-width: 1.5; }
.ship.waiting circle { stroke-dasharray: 2 2; stroke: var(--text-secondary); }
.ship.selected circle { stroke: var(--text-primary); stroke-width: 2.5; }
.ship text { fill: #fff; font-size: 7.5px; font-weight: 700; text-anchor: middle; dominant-baseline: central;
  pointer-events: none; paint-order: stroke; stroke: rgba(0,0,0,.35); stroke-width: 1.5px; }

.controls { display: flex; align-items: center; gap: 10px; padding: 10px 14px; border-top: 1px solid var(--border);
  background: var(--surface-1); flex-wrap: wrap; }
.controls button, .controls select { font: inherit; color: var(--text-primary); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 6px; padding: 5px 10px; cursor: pointer; }
.controls button:hover { border-color: var(--text-muted); }
#play { min-width: 74px; font-weight: 600; }
#slider { flex: 1; min-width: 160px; accent-color: var(--accent); }
#daylabel { font-variant-numeric: tabular-nums; min-width: 118px; font-weight: 600; }

aside { border-left: 1px solid var(--border); overflow-y: auto; padding: 14px 16px; background: var(--surface-1); }
aside#portpanel { border-left: none; border-right: 1px solid var(--border); }
#portselect { width: 100%; font: inherit; font-weight: 600; color: var(--text-primary); background: var(--surface-2);
  border: 1px solid var(--border); border-radius: 6px; padding: 6px 8px; }
.facts { font-size: 12px; color: var(--text-secondary); margin-top: 6px; }
.facts b { color: var(--text-primary); font-weight: 600; }
.shiprow { display: flex; align-items: center; gap: 6px; font-size: 12px; padding: 3px 0; cursor: pointer; }
.shiprow:hover { background: var(--surface-2); }
.shiprow .st { color: var(--text-muted); margin-left: auto; text-align: right; }
.up { color: var(--s6); } .down { color: var(--s8); }
.scrollbox { max-height: 340px; overflow-y: auto; border: 1px solid var(--border); border-radius: 6px; }
.scrollbox table th { position: sticky; top: 0; background: var(--surface-1); }
tr.sel td { background: var(--surface-2); font-weight: 600; }
.port-dot.sel { stroke: var(--accent); stroke-width: 3; }
h1 { font-size: 16px; margin: 0 0 2px; }
h2 { font-size: 12px; text-transform: uppercase; letter-spacing: .06em; color: var(--text-secondary);
  margin: 18px 0 8px; }
.sub { color: var(--text-muted); font-size: 12px; }
.legend { display: grid; grid-template-columns: 1fr 1fr; gap: 4px 10px; font-size: 12px; color: var(--text-secondary); }
.legend span.sw { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: -1px; }
table { width: 100%; border-collapse: collapse; font-size: 12px; }
td, th { padding: 3px 4px; text-align: left; border-bottom: 1px solid var(--border); }
th { color: var(--text-muted); font-weight: 500; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
tr.clickable { cursor: pointer; }
tr.clickable:hover td { background: var(--surface-2); }
.chip { display: inline-flex; align-items: center; justify-content: center; width: 22px; height: 16px;
  border-radius: 8px; color: #fff; font-size: 9px; font-weight: 700; }
.feed { font-size: 12px; }
.feed .item { padding: 6px 0; border-bottom: 1px solid var(--border); }
.feed .meta { color: var(--text-muted); font-size: 11px; }
#selected { font-size: 12px; background: var(--surface-2); border-radius: 8px; padding: 8px 10px; display: none; }

#tip { position: absolute; pointer-events: none; z-index: 5; background: var(--surface-1); color: var(--text-primary);
  border: 1px solid var(--border); border-radius: 8px; padding: 8px 10px; font-size: 12px; max-width: 280px;
  box-shadow: 0 4px 14px rgba(0,0,0,.15); display: none; }
#tip b { font-size: 13px; }
#tip .row { color: var(--text-secondary); }
#tip table { margin-top: 4px; }
.warn { color: var(--s8); font-weight: 600; }

@media (max-width: 1100px) {
  body { grid-template-columns: minmax(0, 1fr) 320px; grid-template-rows: 70vh auto; }
  aside#portpanel { grid-column: 1 / -1; grid-row: 2; border-right: none; border-top: 1px solid var(--border); }
}
@media (max-width: 760px) {
  body { grid-template-columns: 1fr; grid-template-rows: 60vh auto auto; }
  aside { border-left: none; border-top: 1px solid var(--border); }
  aside#portpanel { grid-row: auto; }
}
</style>
</head>
<body>
<aside id="portpanel" aria-label="Port status">
  <h2 style="margin-top:0">Port</h2>
  <select id="portselect" aria-label="Choose a port"></select>
  <div id="portbody"></div>
</aside>
<main>
  <div id="mapwrap">
    <svg id="map" viewBox="0 0 1000 560" preserveAspectRatio="xMidYMid meet" role="img"
         aria-label="Map of the Mediterranean with trading ships"></svg>
    <div id="tip"></div>
  </div>
  <div class="controls">
    <button id="play" title="Play / pause (space)">▶ Play</button>
    <button id="back" title="Back one day (←)">−1 day</button>
    <button id="fwd" title="Forward one day (→)">+1 day</button>
    <input id="slider" type="range" min="0" step="0.05" value="0" aria-label="Day">
    <span id="daylabel">Day 0</span>
    <label class="sub">Speed
      <select id="speed">
        <option value="0.5">½ day/s</option><option value="1" selected>1 day/s</option>
        <option value="2">2 days/s</option><option value="4">4 days/s</option><option value="8">8 days/s</option>
      </select>
    </label>
  </div>
</main>
<aside>
  <h1>Bronze Age trade</h1>
  <div class="sub" id="runmeta"></div>
  <div id="selected"></div>
  <h2>Home ports</h2>
  <div class="legend" id="legend"></div>
  <h2>Leaderboard (silver now)</h2>
  <div class="scrollbox"><table id="board"><thead><tr><th class="num">#</th><th></th><th>Captain</th><th class="num">Silver</th><th class="num">Cargo</th></tr></thead><tbody></tbody></table></div>
  <h2>Tavern talk</h2>
  <div class="feed" id="feed"></div>
</aside>

<script>
const DATA = /*__RUN_DATA__*/null;

const SERIES = ["--s1","--s2","--s3","--s4","--s5","--s6","--s7","--s8"];
const css = n => getComputedStyle(document.documentElement).getPropertyValue(n).trim();
const colorOf = c => `var(${SERIES[c.group % SERIES.length]})`;
const DAYS = DATA.meta.days || Math.max(...Object.values(DATA.snaps).flat().map(s => s[0]), 1);
const byId = Object.fromEntries(DATA.captains.map(c => [c.id, c]));

// ---------- map ----------
const svg = d3.select("#map");
const W = 1000, H = 560;
const bounds = {type: "MultiPoint", coordinates: [[6, 29.6], [37.6, 29.6], [37.6, 42.2], [6, 42.2]]};
const projection = d3.geoMercator().fitExtent([[20, 20], [W - 20, H - 20]], bounds);
const geoPath = d3.geoPath(projection);
const P = name => projection(DATA.ports[name].lonlat);

const gLand = svg.append("g");
const gLanes = svg.append("g");
const gRoute = svg.append("g");
const gPorts = svg.append("g");
const gShips = svg.append("g");
const gLabels = svg.append("g");           // port names on top, so ships never hide them

const ATLAS = /*__ATLAS__*/null;           // embedded by viewer.py; otherwise fetched from the CDN
function drawLand(world) {
  const land = topojson.feature(world, world.objects.countries);
  gLand.selectAll("path").data(land.features).join("path").attr("class", "land").attr("d", geoPath);
}
if (ATLAS) drawLand(ATLAS);
else d3.json("https://cdn.jsdelivr.net/npm/world-atlas@2/countries-50m.json").then(drawLand).catch(() => {});

const laneKeys = Object.keys(DATA.lanes).filter(k => { const [a, b] = k.split("|"); return a < b; });
gLanes.selectAll("path").data(laneKeys).join("path").attr("class", "lane")
  .attr("d", k => d3.line()(DATA.lanes[k].map(ll => projection(ll))));
function routePoints(from, to) {          // projected polyline along the sea lanes, port to port
  const names = DATA.routes[`${from}|${to}`] || [from, to];
  const pts = [];
  for (let i = 1; i < names.length; i++) {
    const lane = (DATA.lanes[`${names[i-1]}|${names[i]}`] || [DATA.ports[names[i-1]].lonlat, DATA.ports[names[i]].lonlat])
      .map(ll => projection(ll));
    pts.push(...(i === 1 ? lane : lane.slice(1)));
  }
  return pts;
}

const portG = gPorts.selectAll("g").data(Object.keys(DATA.ports)).join("g")
  .attr("transform", d => `translate(${P(d)})`);
portG.append("circle").attr("class", "port-dot").attr("r", 5)
  .on("mousemove", (ev, d) => showTip(ev, portTip(d))).on("mouseleave", hideTip)
  .on("click", (ev, d) => selectPort(d));
gLabels.selectAll("text").data(Object.keys(DATA.ports)).join("text").attr("class", "port-label")
  .attr("x", d => P(d)[0] + 8).attr("y", d => P(d)[1] - 8).text(d => d);

// ---------- time lookup ----------
function snapAt(cid, t) {                 // last snapshot with day <= t
  const s = DATA.snaps[cid];
  let lo = 0, hi = s.length - 1, best = -1;
  while (lo <= hi) {
    const mid = (lo + hi) >> 1;
    if (s[mid][0] <= t) { best = mid; lo = mid + 1; } else hi = mid - 1;
  }
  if (best < 0) return null;
  const [day, status, port, from, dest, depart, arrive, until, silver, cargo] = s[best];
  return {day, status, port, from, dest, depart, arrive, until, silver, cargo};
}

function alongRoute(from, to, f) {
  const pts = routePoints(from, to);
  const seg = [];
  let total = 0;
  for (let i = 1; i < pts.length; i++) {
    const l = Math.hypot(pts[i][0] - pts[i-1][0], pts[i][1] - pts[i-1][1]);
    seg.push(l); total += l;
  }
  let d = Math.max(0, Math.min(1, f)) * total;
  for (let i = 0; i < seg.length; i++) {
    if (d <= seg[i] || i === seg.length - 1) {
      const k = seg[i] ? d / seg[i] : 0;
      return [pts[i][0] + (pts[i+1][0] - pts[i][0]) * k, pts[i][1] + (pts[i+1][1] - pts[i][1]) * k];
    }
    d -= seg[i];
  }
  return pts[pts.length - 1];
}

function shipStates(t) {
  const out = [];
  const inPort = {};
  for (const c of DATA.captains) {
    const s = snapAt(c.id, t);
    if (!s || s.status === "stranded") continue;
    const st = {c, s};
    if (s.status === "sea") {
      const span = Math.max(1e-6, s.arrive - s.depart);
      st.xy = alongRoute(s.from, s.dest, (t - s.depart) / span);
    } else {
      (inPort[s.port] = inPort[s.port] || []).push(st);
    }
    out.push(st);
  }
  for (const [port, list] of Object.entries(inPort)) {     // arrange ships in rings around the port
    const [x, y] = P(port);
    list.sort((a, b) => a.c.id < b.c.id ? -1 : 1);
    let i = 0, ring = 0;
    while (i < list.length) {
      const n = Math.min(6 * (ring + 1), list.length - i);   // ring k holds up to 6(k+1) ships
      const r = 17 + ring * 12;
      for (let k = 0; k < n; k++) {
        const a = (2 * Math.PI * k) / n - Math.PI / 2;
        list[i + k].xy = [x + r * Math.cos(a), y + r * Math.sin(a)];
      }
      i += n; ring++;
    }
  }
  return out;
}

// ---------- rendering ----------
let t = 0, playing = false, speed = 1, selected = null, lastBoard = -1, lastFeed = -1, lastSel = null;
let selPort = Object.keys(DATA.ports)[0], lastPortKey = "";
const slider = document.getElementById("slider");
slider.max = DAYS;

function cargoText(cargo) {
  const items = Object.entries(cargo || {});
  return items.length ? items.map(([g, q]) => `${q} ${g}`).join(", ") : "empty";
}
function load(cargo) { return Object.values(cargo || {}).reduce((a, b) => a + b, 0); }

function statusText(s, t) {
  if (s.status === "sea") return `Sailing ${s.from} → <b>${s.dest}</b>, arrives day ${s.arrive}`;
  if (s.status === "waiting") return `Waiting in <b>${s.port}</b> until a ship arrives or day ${s.until}`;
  if (s.status === "port") return `In port at <b>${s.port}</b>`;
  return s.status;
}

function lastSaid(cid, t) {
  for (let i = DATA.statements.length - 1; i >= 0; i--) {
    const st = DATA.statements[i];
    if (st[0] <= t && st[2] === cid) return st;
  }
  return null;
}

function shipTip(c) {
  const s = snapAt(c.id, t);
  if (!s) return "";
  const said = lastSaid(c.id, t);
  return `<b>${c.name}</b> <span class="row">of ${c.home} · ${c.label}</span><br>
    <div class="row">${statusText(s, t)}</div>
    <div>Silver: <b>${s.silver.toFixed(2)}</b> shekels</div>
    <div>Hold (${load(s.cargo)}/40): ${cargoText(s.cargo)}</div>
    ${said ? `<div class="row" style="margin-top:4px">Last said (day ${said[0]}, ${said[1]}): “${escapeHtml(said[5])}”</div>` : ""}`;
}

function portTip(port) {
  const q = (DATA.quotes[port] || []).filter(x => x[0] <= t).pop();
  const ships = shipStates(t).filter(st => st.s.status !== "sea" && st.s.port === port);
  let html = `<b>${port}</b> <span class="row">(${DATA.ports[port].region})</span><br>
    <div class="row">${ships.length} ship(s) in port</div>`;
  if (q) {
    html += `<div class="row">Market as last seen by a captain, day ${q[0]}:</div><table>
      <tr><th>good</th><th class="num">buy</th><th class="num">sell</th><th class="num">stock</th></tr>` +
      Object.entries(q[1]).map(([g, [b, s, st]]) =>
        `<tr><td>${g}</td><td class="num">${b}</td><td class="num">${s}</td><td class="num">${st}</td></tr>`).join("") +
      `</table>`;
  } else html += `<div class="row">No captain has seen this market yet.</div>`;
  return html;
}

function escapeHtml(s) { return s.replace(/[&<>"]/g, ch => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;"}[ch])); }

const tip = document.getElementById("tip");
let tipFor = null;
function showTip(ev, html) {
  const box = document.getElementById("mapwrap").getBoundingClientRect();
  tip.innerHTML = html; tip.style.display = "block";
  let x = ev.clientX - box.left + 14, y = ev.clientY - box.top + 14;
  if (x + tip.offsetWidth > box.width) x -= tip.offsetWidth + 28;
  if (y + tip.offsetHeight > box.height) y -= tip.offsetHeight + 28;
  tip.style.left = x + "px"; tip.style.top = y + "px";
}
function hideTip() { tip.style.display = "none"; tipFor = null; }

function render() {
  const states = shipStates(t);
  const ships = gShips.selectAll("g.ship").data(states, d => d.c.id).join(enter => {
    const g = enter.append("g").attr("class", "ship");
    g.append("circle").attr("r", 8.5);
    g.append("text");
    g.on("mousemove", (ev, d) => { tipFor = d.c; showTip(ev, shipTip(d.c)); })
     .on("mouseleave", hideTip)
     .on("click", (ev, d) => { selected = selected === d.c.id ? null : d.c.id; render(); });
    return g;
  });
  ships.attr("transform", d => `translate(${d.xy[0]},${d.xy[1]})`)
    .classed("waiting", d => d.s.status === "waiting")
    .classed("selected", d => d.c.id === selected);
  ships.select("circle").attr("fill", d => colorOf(d.c)).attr("r", d => d.c.id === selected ? 10.5 : 8.5);
  ships.select("text").text(d => d.c.label);
  ships.filter(d => d.c.id === selected).raise();
  if (tipFor && tip.style.display === "block") tip.innerHTML = shipTip(tipFor);

  // selected captain: route + details
  const sel = selected && states.find(st => st.c.id === selected);
  const routePts = sel && sel.s.status === "sea" ? routePoints(sel.s.from, sel.s.dest) : [];
  gRoute.selectAll("path").data(routePts.length ? [routePts] : []).join("path").attr("class", "route")
    .attr("d", d => d3.line()(d));
  const box = document.getElementById("selected");
  if (selected) {
    box.style.display = "block";
    box.innerHTML = shipTip(byId[selected]) + `<div class="sub" style="margin-top:4px">Click the ship again to deselect.</div>`;
  } else box.style.display = "none";

  document.getElementById("daylabel").textContent = `Day ${t.toFixed(1)} / ${DAYS}`;
  slider.value = t;
  const day = Math.floor(t);
  if (day !== lastBoard || selected !== lastSel) { lastBoard = day; lastSel = selected; renderBoard(day); }
  renderPort();
  if (day !== lastFeed) { lastFeed = day; renderFeed(day); }
}

function renderBoard(day) {
  const rows = DATA.captains.map(c => ({c, s: snapAt(c.id, day + 0.999)})).filter(r => r.s)
    .sort((a, b) => b.s.silver - a.s.silver);
  d3.select("#board tbody").selectAll("tr").data(rows, r => r.c.id).join("tr")
    .attr("class", r => "clickable" + (r.c.id === selected ? " sel" : "")).order()
    .html((r, i) => `<td class="num">${i + 1}</td><td><span class="chip" style="background:${colorOf(r.c)}">${r.c.label}</span></td>
      <td>${r.c.name}${r.s.status === "stranded" ? ' <span class="warn">stranded</span>' : ""}</td>
      <td class="num">${r.s.silver.toFixed(0)}</td><td class="num">${load(r.s.cargo)}</td>`)
    .on("click", (ev, r) => { selected = r.c.id; render(); });
}

function renderFeed(day) {
  const items = DATA.statements.filter(s => s[0] <= day).slice(-80).reverse();
  document.getElementById("feed").innerHTML = items.length ? items.map(s => {
    const c = byId[s[2]];
    return `<div class="item"><div class="meta"><span class="chip" style="background:${colorOf(c)}">${c.label}</span>
      ${s[3]} · day ${s[0]} · ${s[1]} · heard by ${s[6] - 1} other(s)</div>“${escapeHtml(s[5])}”</div>`;
  }).join("") : `<div class="sub">Nothing said yet.</div>`;
}

// ---------- port panel ----------
const portSelect = document.getElementById("portselect");
portSelect.innerHTML = Object.keys(DATA.ports).map(p => `<option value="${p}">${p} (${DATA.ports[p].region})</option>`).join("");
portSelect.onchange = () => selectPort(portSelect.value);
function selectPort(p) { selPort = p; portSelect.value = p; lastPortKey = ""; renderPort(); }

function marketOn(port, day) {                       // true market (replayed), clamped to the run's days
  const series = (DATA.market || {})[port] || [];
  return series[Math.max(0, Math.min(series.length - 1, day))];
}

function renderPort() {
  const day = Math.floor(t);
  const key = `${selPort}|${day}|${selected}`;
  if (key === lastPortKey) return;
  lastPortKey = key;
  gPorts.selectAll("circle.port-dot").classed("sel", d => d === selPort);
  const info = DATA.ports[selPort];
  const list = o => Object.entries(o || {}).map(([g, r]) => `${g} ${r}/day`).join(", ") || "—";
  let html = `<div class="facts">Produces: <b>${list(info.produce)}</b><br>Consumes: <b>${list(info.consume)}</b>` +
    (info.bronze ? `<br>Makes bronze: <b>${info.bronze} batch(es)/day</b> (9 copper + 1 tin → 10)` : "") + `</div>`;

  const here = [], coming = [];
  for (const c of DATA.captains) {
    const s = snapAt(c.id, day + 0.999);
    if (!s || s.status === "stranded") continue;
    if (s.status !== "sea" && s.port === selPort) here.push({c, s});
    else if (s.status === "sea" && s.dest === selPort) coming.push({c, s});
  }
  const row = (r, status) => `<div class="shiprow" data-id="${r.c.id}"><span class="chip" style="background:${colorOf(r.c)}">${r.c.label}</span>
      ${r.c.name}<span class="st">${status}</span></div>`;
  html += `<h2>In port now (${here.length})</h2>` + (here.map(r => row(r,
      r.s.status === "waiting" ? `waiting until day ${r.s.until}` : "awake")).join("") || `<div class="sub">No ships.</div>`);
  coming.sort((a, b) => a.s.arrive - b.s.arrive);
  html += `<h2>Sailing here (${coming.length})</h2>` + (coming.map(r => row(r, `from ${r.s.from}, day ${r.s.arrive}`)).join("")
      || `<div class="sub">No ships.</div>`);

  const m = marketOn(selPort, day), prev = marketOn(selPort, day - 7);
  if (m) {
    html += `<h2>Market, day ${m[0]} (true values)</h2><table>
      <tr><th>good</th><th class="num">buy</th><th class="num">sell</th><th class="num">stock</th><th class="num">demand</th><th class="num">7d</th></tr>` +
      Object.entries(m[1]).map(([g, [b, sl, st, dm]]) => {
        const before = prev && prev[1][g] ? prev[1][g][0] : b;
        const ch = before ? (b - before) / before : 0;
        const arrow = Math.abs(ch) < 0.03 ? "" : ch > 0 ? `<span class="up">▲${Math.round(ch * 100)}%</span>`
                                                         : `<span class="down">▼${Math.round(-ch * 100)}%</span>`;
        const demand = info.consume && info.consume[g] ? `${dm}×` : "—";
        return `<tr><td>${g}</td><td class="num">${b}</td><td class="num">${sl}</td><td class="num">${st}</td>
          <td class="num">${demand}</td><td class="num">${arrow}</td></tr>`;
      }).join("") + `</table><div class="sub" style="margin-top:4px">Buy/sell = what a captain pays/gets for the next unit.
      Demand = today's consumption vs normal. 7d = buy-price change over the last week. Captains only see this when they're here.</div>`;
  }

  const talk = DATA.statements.filter(st => st[1] === selPort && st[0] <= day).slice(-30).reverse();
  html += `<h2>The barkeep remembers (${DATA.statements.filter(st => st[1] === selPort && st[0] <= day).length})</h2>` +
    (talk.map(st => { const c = byId[st[2]]; return `<div class="feed"><div class="item"><div class="meta">
      <span class="chip" style="background:${colorOf(c)}">${c.label}</span> ${st[3]} · day ${st[0]}</div>“${escapeHtml(st[5])}”</div></div>`; }).join("")
      || `<div class="sub">Nothing said here yet.</div>`);

  const body = document.getElementById("portbody");
  body.innerHTML = html;
  body.querySelectorAll(".shiprow").forEach(el => el.onclick = () => { selected = el.dataset.id; render(); });
}

// ---------- side panel static bits ----------
document.getElementById("runmeta").innerHTML =
  `Run ${DATA.meta.run} · seed ${DATA.meta.seed} · ${DATA.captains.length} captains · ${DAYS} days` +
  (DATA.meta.aborted ? `<br><span class="warn">Aborted: ${escapeHtml(DATA.meta.aborted)}</span>` : "");
document.getElementById("legend").innerHTML = DATA.groups.map((g, i) =>
  `<div><span class="sw" style="background:var(${SERIES[i]})"></span>${g}</div>`).join("") +
  `<div style="grid-column:1/-1;margin-top:4px">Dashed outline = asleep, waiting in port. Hover a ship or port for details; click a ship to follow it.</div>`;

// ---------- playback ----------
const playBtn = document.getElementById("play");
function setPlaying(p) {
  playing = p; playBtn.textContent = p ? "❚❚ Pause" : "▶ Play";
  if (p && t >= DAYS) t = 0;
  if (p) { last = null; requestAnimationFrame(tick); }
}
let last = null;
function tick(ts) {
  if (!playing) return;
  if (last !== null) t = Math.min(DAYS, t + ((ts - last) / 1000) * speed);
  last = ts;
  render();
  if (t >= DAYS) { setPlaying(false); return; }
  requestAnimationFrame(tick);
}
playBtn.onclick = () => setPlaying(!playing);
document.getElementById("back").onclick = () => { t = Math.max(0, Math.ceil(t) - 1); render(); };
document.getElementById("fwd").onclick = () => { t = Math.min(DAYS, Math.floor(t) + 1); render(); };
document.getElementById("speed").onchange = e => { speed = +e.target.value; };
slider.oninput = () => { t = +slider.value; render(); };
document.addEventListener("keydown", e => {
  if (e.target.tagName === "SELECT" || e.target.tagName === "INPUT" && e.key !== " ") return;
  if (e.key === " ") { e.preventDefault(); setPlaying(!playing); }
  if (e.key === "ArrowRight") document.getElementById("fwd").click();
  if (e.key === "ArrowLeft") document.getElementById("back").click();
});

render();
</script>
</body>
</html>
